<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบจัดการรูปภาพ (อัปโหลด 5 รูป, แก้ไข, ลบ)</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            max-width: 800px; 
            margin: auto; 
            background-image: url('deadpool.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
        }
        h1 { color: #fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
        .box { 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            background-color: rgba(255, 255, 255, 0.95); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .result-item { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 15px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 15px; 
            align-items: center; 
        }
        .result-item img { max-width: 120px; border-radius: 5px; object-fit: cover; border: 2px solid #ddd; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; font-size: 14px; text-decoration: none; display: inline-block; margin-right: 5px;}
        .download-btn { background-color: #007bff; }
        .edit-btn { background-color: #ffc107; color: black; }
        .delete-btn { background-color: #dc3545; }
        .save-btn { background-color: #28a745; }
    </style>
</head>
<body>

    <h1>ระบบจัดการรูปภาพ (อัปโหลด 5 รูป, แก้ไข, ลบ)</h1>

    <!-- ส่วนที่ 1: ฟอร์มอัปโหลด (เลือกได้สูงสุด 5 รูป) -->
    <div class="box">
        <h3>อัปโหลดรูปภาพใหม่ (สูงสุด 5 รูป)</h3>
        <form id="uploadForm">
            <p><input type="text" name="title" placeholder="ชื่อรูปภาพ (หัวข้อ)" required style="width: 100%; padding: 8px; box-sizing: border-box;"></p>
            <p><textarea name="description" placeholder="รายละเอียด..." required style="width: 100%; padding: 8px; box-sizing: border-box; height: 60px;"></textarea></p>
            <p><input type="file" name="imageFiles" accept="image/*" multiple required> <small>(เลือกได้สูงสุด 5 รูป)</small></p>
            <button type="submit" class="btn save-btn">อัปโหลดเลย</button>
        </form>
        <p id="uploadStatus" style="color: green; font-weight: bold;"></p>
    </div>

    <!-- ส่วนที่ 2: ค้นหาและแสดงผล -->
    <div class="box">
        <h3>ค้นหาข้อมูล</h3>
        <p>
            <input type="text" id="searchInput" placeholder="พิมพ์คำค้นหาที่นี่..." style="padding: 6px; width: 60%; box-sizing: border-box;">
            <button type="button" onclick="searchData()" class="btn download-btn">ค้นหา</button>
        </p>
        
        <div id="results" style="margin-top: 20px;"></div>
    </div>

    <script>
        // อัปโหลดข้อมูล (รองรับหลายไฟล์)
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const statusEl = document.getElementById('uploadStatus');

            try {
                statusEl.style.color = 'green';
                statusEl.innerText = 'กำลังอัปโหลด...';

                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                statusEl.innerText = result.message;
                e.target.reset(); 
            } catch (err) {
                statusEl.style.color = 'red';
                statusEl.innerText = 'เกิดข้อผิดพลาดในการอัปโหลด';
            }
        });

        // ค้นหาข้อมูล
        async function searchData() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;

            try {
                const response = await fetch(`/search?q=${encodeURIComponent(keyword)}`);
                const data = await response.json();
                renderResults(data);
            } catch (err) {
                console.error('Error searching:', err);
            }
        }

        // แสดงผลพร้อมปุ่ม แก้ไข / ลบ / ดาวน์โหลด
        function renderResults(data) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = ''; 

            if (data.length === 0) {
                resultsDiv.innerHTML = '<p style="color: gray; font-style: italic;">ไม่พบข้อมูล</p>';
                return;
            }

            data.forEach(item => {
                resultsDiv.innerHTML += `
                    <div class="result-item" id="item-${item._id}">
                        <img src="${item.imageUrl}" alt="${item.title}">
                        <div style="flex-grow: 1;" id="content-${item._id}">
                            <h4 style="margin: 0 0 5px 0;" id="title-text-${item._id}">${item.title}</h4>
                            <p style="margin: 0 0 10px 0; font-size: 14px; color: #555;" id="desc-text-${item._id}">${item.description}</p>
                            
                            <a href="${item.imageUrl}" target="_blank" download class="btn download-btn">ดาวน์โหลด</a>
                            <button onclick="enableEdit('${item._id}', '${item.title}', '${item.description}')" class="btn edit-btn">แก้ไข</button>
                            <button onclick="deleteItem('${item._id}')" class="btn delete-btn">ลบ</button>
                        </div>
                    </div>
                `;
            });
        }

        // เปิดโหมดแก้ไขข้อมูล
        function enableEdit(id, currentTitle, currentDesc) {
            const contentDiv = document.getElementById(`content-${id}`);
            contentDiv.innerHTML = `
                <input type="text" id="edit-title-${id}" value="${currentTitle}" style="width: 100%; padding: 5px; margin-bottom: 5px;"><br>
                <textarea id="edit-desc-${id}" style="width: 100%; padding: 5px; margin-bottom: 5px; height: 40px;">${currentDesc}</textarea><br>
                <button onclick="saveEdit('${id}')" class="btn save-btn">บันทึก</button>
                <button onclick="searchData()" class="btn" style="background-color: #6c757d;">ยกเลิก</button>
            `;
        }

        // บันทึกข้อมูลที่แก้ไข
        async function saveEdit(id) {
            const newTitle = document.getElementById(`edit-title-${id}`).value;
            const newDesc = document.getElementById(`edit-desc-${id}`).value;

            try {
                const response = await fetch(`/update/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle, description: newDesc })
                });
                const result = await response.json();
                alert(result.message);
                searchData();
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการแก้ไข');
            }
        }

        // ลบรูปภาพ
        async function deleteItem(id) {
            if (!confirm('คุณต้องการลบรูปนี้ใช่หรือไม่?')) return;

            try {
                const response = await fetch(`/delete/${id}`, { method: 'DELETE' });
                const result = await response.json();
                alert(result.message);
                document.getElementById(`item-${id}`).remove();
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการลบ');
            }
        }
    </script>
</body>
</html>
