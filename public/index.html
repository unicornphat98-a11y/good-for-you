<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบอัปโหลดและค้นหารูปภาพ</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            max-width: 800px; 
            margin: auto; 
            
            /* ใช้รูปภาพพื้นหลังเป็นไฟล์ deadpool.jpg (ไฟล์ต้องอยู่ในโฟลเดอร์ public ด้วยนะครับ) */
            background-image: url('deadpool.jpg'); 
            
            background-size: cover;          /* ยืดรูปให้เต็มจอพอดี */
            background-position: center;     /* จัดรูปให้อยู่ตรงกลาง */
            background-attachment: fixed;    /* ล็อกรูปพื้นหลังไม่ให้เลื่อนตามเวลาเลื่อนหน้าเว็บ */
            color: #333;
        }
        h1 {
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .box { 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            background-color: rgba(255, 255, 255, 0.9); /* ทำให้กล่องขาวโปร่งแสงเล็กน้อยเพื่อให้อ่านตัวหนังสือง่าย */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .result-item { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 15px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 15px; 
            align-items: center; 
        }
        .result-item img { 
            max-width: 150px; 
            border-radius: 5px; 
            object-fit: cover; 
            border: 2px solid #ddd;
        }
        .download-btn { 
            display: inline-block; 
            margin-top: 8px; 
            padding: 6px 12px; 
            background-color: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 4px; 
            font-size: 14px; 
        }
        .download-btn:hover { 
            background-color: #0056b3; 
        }
    </style>
</head>
<body>

    <h1>ระบบอัปโหลดและค้นหารูปภาพ</h1>

    <!-- ส่วนที่ 1: ฟอร์มอัปโหลด -->
    <div class="box">
        <h3>อัปโหลดข้อมูลใหม่</h3>
        <form id="uploadForm">
            <p><input type="text" name="title" placeholder="ชื่อรูปภาพ (หัวข้อ)" required style="width: 100%; padding: 8px; box-sizing: border-box;"></p>
            <p><textarea name="description" placeholder="รายละเอียด..." required style="width: 100%; padding: 8px; box-sizing: border-box; height: 60px;"></textarea></p>
            <p><input type="file" name="imageFile" accept="image/*" required></p>
            <button type="submit" style="padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">อัปโหลดเลย</button>
        </form>
        <p id="uploadStatus" style="color: green; font-weight: bold;"></p>
    </div>

    <!-- ส่วนที่ 2: ค้นหาและแสดงผล -->
    <div class="box">
        <h3>ค้นหาข้อมูล</h3>
        <p>
            <input type="text" id="searchInput" placeholder="พิมพ์คำค้นหาที่นี่..." style="padding: 6px; width: 60%; box-sizing: border-box;">
            <button type="button" onclick="searchData()" style="padding: 6px 12px; cursor: pointer;">ค้นหา</button>
        </p>
        
        <div id="results" style="margin-top: 20px;">
            <!-- ผลการค้นหาจะแสดงเมื่อกดปุ่มค้นหา -->
        </div>
    </div>

    <script>
        // จัดการตอนกดปุ่มอัปโหลด
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const statusEl = document.getElementById('uploadStatus');

            try {
                statusEl.style.color = 'green';
                statusEl.innerText = 'กำลังอัปโหลด...';

                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                statusEl.innerText = result.message;
                e.target.reset(); 
            } catch (err) {
                statusEl.style.color = 'red';
                statusEl.innerText = 'เกิดข้อผิดพลาดในการอัปโหลด';
            }
        });

        // ค้นหาข้อมูล
        async function searchData() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;

            try {
                const response = await fetch(`/search?q=${encodeURIComponent(keyword)}`);
                const data = await response.json();
                renderResults(data);
            } catch (err) {
                console.error('Error searching:', err);
            }
        }

        // แสดงผลพร้อมปุ่มดาวน์โหลด
        function renderResults(data) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = ''; 

            if (data.length === 0) {
                resultsDiv.innerHTML = '<p style="color: gray; font-style: italic;">ไม่พบข้อมูล</p>';
                return;
            }

            data.forEach(item => {
                resultsDiv.innerHTML += `
                    <div class="result-item">
                        <img src="${item.imageUrl}" alt="${item.title}">
                        <div>
                            <h4 style="margin: 0 0 5px 0;">${item.title}</h4>
                            <p style="margin: 0 0 10px 0; font-size: 14px; color: #555;">${item.description}</p>
                            <a href="${item.imageUrl}" target="_blank" download class="download-btn">ดาวน์โหลดรูปนี้</a>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
